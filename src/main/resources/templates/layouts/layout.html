<!-- layouts/layout.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8"/>
<!--    config PWA-->
    <link rel="manifest" href="/manifest.json">
    <script src="/js/main.js"></script>
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <script>
        async function subscribeToPush() {
            const register = await navigator.serviceWorker.register("/sw.js");
            const subscription = await register.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: "BJysKMjkq86zvJHWK5uDoNECcta_MMD0Y-9kTCvep7VRhk2MVKSu1ULfsGaiUDcTdh9_xoxMoQdccly4Ba5Cusc"
            });

            await fetch("/api/subscribe", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(subscription)
            });

            alert("Đăng ký thành công!");
        }

    </script>

</head>
<body>
<header>
    <h2 style="font-size: 6rem; font-weight: bold;">Demo PWA Spring Boot</h2>
</header>
<main>
    <section layout:fragment="content"></section>
</main>

<script>
    //config PWA
    // Đăng ký service worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(swReg => {
                    console.log('Service Worker is registered', swReg);
                })
                .catch(err => {
                    console.error('Service Worker Error', err);
                });
        });
    }

    // Hàm chuyển VAPID key từ base64 sang Uint8Array
    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
    }

    document.addEventListener('DOMContentLoaded', function () {
        const subscribeBtn = document.getElementById('subscribe-btn');
        if (subscribeBtn && 'serviceWorker' in navigator && 'PushManager' in window) {
            subscribeBtn.onclick = async function () {
                const PUBLIC_VAPID_KEY = 'BJysKMjkq86zvJHWK5uDoNECcta_MMD0Y-9kTCvep7VRhk2MVKSu1ULfsGaiUDcTdh9_xoxMoQdccly4Ba5Cusc'; //
                try {
                    // Bắt buộc phải request permission notification trước
                    let permission = Notification.permission;
                    if (permission !== 'granted') {
                        permission = await Notification.requestPermission();
                        if (permission !== 'granted') {
                            alert('Bạn phải cho phép nhận thông báo!');
                            return;
                        }
                    }

                    const registration = await navigator.serviceWorker.ready;
                    const subscription = await registration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
                    });

                    // Gửi subscription về backend
                    await fetch('/api/subscribe', {
                        method: 'POST',
                        body: JSON.stringify(subscription),
                        headers: { 'Content-Type': 'application/json' }
                    });

                    alert('Đăng ký nhận thông báo thành công!');
                } catch (e) {
                    alert('Đăng ký thất bại hoặc bạn chưa cho phép notification!');
                    console.error(e);
                }
            }
        }
    });
</script>
</body>
</html>
